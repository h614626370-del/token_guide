<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="description" content="吃豆人网页小游戏">
    <title>吃豆人</title>
    <link rel="shortcut icon" href="favicon.png">
    <style>
      :root { color-scheme: light; font-family: "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; margin: 0; background: #10151a; color: #e7efed; }
      body { display: grid; min-height: 100vh; place-items: center; padding: 18px; }
      .game-shell { width: min(100%, 1000px); padding: 18px; border: 1px solid #2d3a42; border-radius: 12px; background: #1a2329; box-shadow: 0 12px 34px rgba(0, 0, 0, .24); text-align: center; }
      h1 { margin: 0 0 12px; color: #fff; font-size: clamp(20px, 4vw, 30px); }
      canvas { display: block; width: min(100%, 960px); height: auto; margin: 0 auto; border: 1px solid #40525b; border-radius: 6px; background: #000; touch-action: none; }
      p { margin: 12px 0 0; color: #a9bab6; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <h1>吃豆人</h1>
      <canvas id="canvas" width="960" height="640">不支持画布</canvas>
      <p>使用方向键移动，按空格键暂停或继续</p>
    </main>
    <script src="./static/script/game.js"></script>
    <script src="./static/script/index.js"></script>
  </body>
</html>
